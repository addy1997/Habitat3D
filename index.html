    <script>
      window.addEventListener('error', function(event) {
        document.body.innerHTML = '<div style="color:red; background:white; padding:20px; font-size: 24px; position:absolute; top:0; left:0; z-index:99999;">ERROR: ' + event.message + '<br><pre>' + event.error.stack + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:red; background:white; padding:20px; font-size: 24px; position:absolute; top:0; left:0; z-index:99999;">PROMISE REJECTION: ' + event.reason + '</div>';
      });
    </script>
